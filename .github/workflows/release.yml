name: Release

# Publish qevedo-simulator to PyPI when the version in python/Cargo.toml
# changes on master and has no tag yet, or when a version tag (vX.Y.Z) is
# pushed; a pushed tag must match the version. CI must pass. Releasing from
# master needs no tag push (the daily improvement routine cannot push tags):
# the GitHub release creates the tag vX.Y.Z at the released commit, and a tag
# made with the workflow's own token starts no further workflow run.
#
# Publishing uses PyPI trusted publishing: on pypi.org, add a (pending)
# trusted publisher for project "qevedo-simulator", owner "qevedo",
# repository "qevedo-simulator", workflow "release.yml", environment "pypi".
#
# x86-64 wheels target x86-64-v3 (AVX2 + FMA, 2013-2015 processors and newer)
# for qvd's AVX2 kernels; the repository's own `-C target-cpu=native` must not
# leak into wheels, so every build sets RUSTFLAGS.
on:
  push:
    branches: [master]
    # Path filters apply to the branch only: every version tag runs.
    paths: [python/Cargo.toml, .github/workflows/release.yml]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Decide whether to release, and which tag
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -1)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match python/Cargo.toml version $version"
              exit 1
            fi
            release=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released: nothing to do"
            release=false
          else
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: [ci, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, rustflags: "-C target-cpu=x86-64-v3" }
          - { os: ubuntu-latest, target: aarch64, rustflags: "-C target-cpu=generic" }
          - { os: macos-latest, target: aarch64, rustflags: "-C target-cpu=apple-m1" }
          - { os: macos-latest, target: x86_64, rustflags: "-C target-cpu=x86-64-v3" }
          - { os: windows-latest, target: x64, rustflags: "-C target-cpu=x86-64-v3" }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          docker-options: -e RUSTFLAGS
      - name: Check the x86-64 Linux wheel
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        run: |
          python -m pip install python/dist/*.whl
          python -c "import qevedo.simulator as s; assert s.uses_avx2(); print(s.run(s.Circuit(2).h(0).cx(0, 1).t(1).measure_all(), 100, seed=1).counts)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/

  sdist:
    needs: [ci, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qevedo-simulator/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release (and the tag, if it is new)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
